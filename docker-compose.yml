services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${POSTSALE_AGENT_IMAGE:-postsale-agent:local}
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3002}
      POSTSALE_AGENT_CHAT_MODEL: ${POSTSALE_AGENT_CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
