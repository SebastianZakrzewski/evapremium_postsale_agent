# Production on VPS: pull a pre-built image from GHCR (push happens via GitHub Actions on main).
# No Dockerfile/source needed on the server—only this file, .env, and Docker.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Set POSTSALE_AGENT_IMAGE in .env (lowercase path), e.g. ghcr.io/sebastianzakrzewski/evapremium_postsale_agent:main

services:
  app:
    image: ${POSTSALE_AGENT_IMAGE:?Set POSTSALE_AGENT_IMAGE in .env (ghcr.io/owner/repo:tag)}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3002}
      POSTSALE_AGENT_CHAT_MODEL: ${POSTSALE_AGENT_CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LANGCHAIN_TRACING_V2: ${LANGCHAIN_TRACING_V2:-}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
